[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "franky-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents query Spanish university admissions data (sample dataset)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Teferi Laforga" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "pydantic>=2.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.6",
]

[project.scripts]
franky-mcp = "franky_mcp.cli:main"

[project.urls]
"Franky app" = "https://github.com/teferi26/franky-app"

[tool.hatch.build.targets.wheel]
packages = ["src/franky_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/sample" = "franky_mcp/_data/sample"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
